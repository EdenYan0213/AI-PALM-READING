server:
  port: 8080

spring:
  application:
    name: palmistry-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

llm:
  enabled: ${LLM_ENABLED:true}
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:Pro/moonshotai/Kimi-K2.6}
  fallback-model: ${LLM_FALLBACK_MODEL:ZhipuAI/GLM-5.1}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:90}
