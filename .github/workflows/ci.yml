name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 前端构建由 frontend-maven-plugin 自动完成（node 自动下载），
      # 这里预装 node + npm 缓存只为加速 npm install。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stitch_/frontend/package-lock.json

      - name: Build & verify (backend + frontend)
        working-directory: stitch_/backend
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: stitch_/backend/target/surefire-reports/
